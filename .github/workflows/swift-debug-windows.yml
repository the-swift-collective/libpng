name: Run Tests (Microsoft Windows)

on: [push]

jobs:
  build:
    name: Swift 6.1 on windows-2025
    runs-on: windows-2025
    steps:
      - uses: compnerd/gha-setup-swift@v0.3.0
        with:
          branch: swift-6.1-release
          tag: 6.1-RELEASE
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: 🧪 Test
        run: swift test
